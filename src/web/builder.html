<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101318" />
  <title>Floor Builder – Campus Twin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/studio.css" />
  <link rel="stylesheet" href="assets/css/floor-builder.css" />
</head>
<body class="floor-builder">
  <header class="builderbar">
    <a class="brand" href="./" aria-label="Campus Twin home"><span class="brand-mark">CT</span><span class="brand-name">Campus Twin</span></a>
    <div class="builder-project">
      <p class="eyebrow">PLAN AUTHORING</p>
      <strong id="project-name"></strong>
    </div>
    <span id="dimension-status" class="dimension-status">Estimated dimensions</span>
    <span id="save-state" class="save-state" role="status">Draft is stored in this browser</span>
    <nav class="builder-actions" aria-label="Project actions">
      <a class="btn" href="studio.html">Open Studio</a>
      <button class="btn btn-primary" id="export-layout" type="button">Download JSON</button>
      <button class="btn btn-ghost" id="reset-layout" type="button">Reset</button>
    </nav>
  </header>

  <main class="builder-layout">
    <aside class="builder-panel builder-left" aria-label="Building and floor settings">
      <section class="builder-section">
        <div class="section-heading">
          <div><p class="eyebrow">SHARED ENVELOPE</p><h2>Building dimensions</h2></div>
          <span class="unit-label">METRES</span>
        </div>
        <div class="field-grid">
          <label for="footprint-width">Width
            <span class="input-unit"><input id="footprint-width" type="number" min="1" max="1000" step="0.1" required /><span>m</span></span>
          </label>
          <label for="footprint-depth">Depth
            <span class="input-unit"><input id="footprint-depth" type="number" min="1" max="1000" step="0.1" required /><span>m</span></span>
          </label>
        </div>
        <label for="dimension-basis">Dimension basis
          <select id="dimension-basis">
            <option value="estimated">Estimated</option>
            <option value="measured">Measured from source</option>
          </select>
        </label>
        <label for="dimension-source">Source or note
          <input id="dimension-source" type="text" maxlength="160" />
        </label>
        <p id="dimension-note" class="dimension-note"></p>
      </section>

      <section class="builder-section">
        <div class="section-heading">
          <div><p class="eyebrow">LEVELS</p><h2>Floor settings</h2></div>
          <span id="floor-count" class="unit-label"></span>
        </div>
        <label for="floor-select">Active floor
          <select id="floor-select"></select>
        </label>
        <div class="button-row">
          <button class="btn btn-primary" id="add-floor" type="button">+ Add floor</button>
          <button class="btn btn-danger" id="delete-floor" type="button">Delete floor</button>
        </div>
        <label for="floor-name">Floor name
          <input id="floor-name" type="text" maxlength="80" required />
        </label>
        <label for="floor-short">Plan code
          <input id="floor-short" type="text" maxlength="12" />
        </label>
      </section>
    </aside>

    <section class="builder-canvas" aria-label="Floor plan canvas">
      <header class="canvas-toolbar">
        <div class="canvas-heading">
          <h1 id="canvas-title"></h1>
          <span id="canvas-meta" class="mono"></span>
        </div>
        <div class="canvas-tools" aria-label="Plan view controls">
          <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          <button class="icon-btn" id="zoom-fit" type="button" aria-label="Fit plan" title="Fit plan">⤢</button>
        </div>
      </header>
      <div id="plan-canvas" class="plan-canvas"></div>
      <footer class="canvas-footer mono">
        <span id="placement-state" role="status">READY</span>
        <span id="canvas-size"></span>
      </footer>
    </section>

    <aside class="builder-panel builder-right" aria-label="Room editor">
      <section class="builder-section spaces-section">
        <div class="section-heading">
          <div><p class="eyebrow">ACTIVE FLOOR</p><h2>Spaces</h2></div>
          <button class="btn btn-primary" id="add-space" type="button">+ Add space</button>
        </div>
        <ul id="room-list" class="room-list"></ul>
        <p id="room-empty" class="empty-state" hidden>Select or add a space.</p>
      </section>

      <form id="room-form" class="room-form" hidden>
        <h3>Space geometry</h3>
        <label for="room-name">Name
          <input id="room-name" type="text" maxlength="80" required />
        </label>
        <label for="room-type">Category
          <select id="room-type"></select>
        </label>
        <div class="field-grid">
          <label for="room-width">Width
            <span class="input-unit"><input id="room-width" type="number" min="0.5" step="0.1" required /><span>m</span></span>
          </label>
          <label for="room-depth">Depth
            <span class="input-unit"><input id="room-depth" type="number" min="0.5" step="0.1" required /><span>m</span></span>
          </label>
          <label for="room-x">Centre X
            <span class="input-unit"><input id="room-x" type="number" step="0.1" required /><span>m</span></span>
          </label>
          <label for="room-z">Centre Z
            <span class="input-unit"><input id="room-z" type="number" step="0.1" required /><span>m</span></span>
          </label>
        </div>
        <output id="room-area" class="room-area"></output>
        <button class="btn place-button" id="place-room" type="button" aria-pressed="false">Place on plan</button>
        <button class="btn btn-danger wide" id="delete-room" type="button">Delete space</button>
      </form>
    </aside>
  </main>

  <div id="builder-toast" class="toast hidden" role="status"></div>
  <script type="module" src="js/app/builder.js"></script>
</body>
</html>
